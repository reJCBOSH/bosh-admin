version: '3.8'

services:
  # MySQL数据库服务
  mysql:
    image: mysql:8.0
    container_name: bosh_admin_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 123456ljc
      MYSQL_DATABASE: bosh-admin
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - bosh_admin_network

  # 应用服务
  app:
    build: .
    container_name: bosh_admin_app
    restart: always
    ports:
      - "8089:8089"
    depends_on:
      - mysql
    environment:
      - SERVER_PORT=8089
    volumes:
      - ./static:/root/static
      - ./logs:/root/logs
    networks:
      - bosh_admin_network

volumes:
  mysql_data:

networks:
  bosh_admin_network:
    driver: bridge